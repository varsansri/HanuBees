name: Viral video (auto post)

# Self-driving: on schedule, render the NEXT un-posted script (content.js) and
# publish it to IG + TikTok via Zernio, then log it so it never repeats.
# 6×/day (UTC) ≈ healthy IST posting windows → drains 36 videos in ~6 days, then wraps.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Specific script id (e.g. c01), or blank for next un-posted'
        required: false
        default: ''
  schedule:
    - cron: '21 2,5,8,11,14,17 * * *'

concurrency:
  group: viral-batch
  cancel-in-progress: false

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanubees-marketing-team/video
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      VIDEO_ID: ${{ github.event.inputs.video_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chrome + emoji fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libatk-bridge2.0-0 libgtk-3-0 libxkbcommon0 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxrandr2 libxfixes3 libpango-1.0-0 libcairo2 fonts-liberation \
            fonts-noto-color-emoji || true
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Pick next script + build props
        run: node scripts/build-content.js
      - name: Render video
        run: npx remotion render src/index.ts HookVideo out/video.mp4 --props=out/props.json
      - name: Post to IG + TikTok
        run: node scripts/post.js
      - name: Log as posted
        run: node scripts/mark-posted.js
      - name: Upload copy
        uses: actions/upload-artifact@v4
        with:
          name: hookvideo-${{ github.run_id }}
          path: hanubees-marketing-team/video/out/video.mp4
          retention-days: 7
