name: Demo video (preview)

# Renders the F1-style phone-demo video to a downloadable artifact (no posting).
on:
  workflow_dispatch:
    inputs:
      demo_id:
        description: 'Demo id'
        required: false
        default: 'd01'

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanubees-marketing-team/video
    env:
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      DEMO_ID: ${{ github.event.inputs.demo_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chrome + emoji fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libatk-bridge2.0-0 libgtk-3-0 libxkbcommon0 libx11-xcb1 libxcomposite1 \
            libxdamage1 libxrandr2 libxfixes3 libpango-1.0-0 libcairo2 fonts-liberation \
            fonts-noto-color-emoji || true
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Build demo props
        run: node scripts/build-demo.js
      - name: Render demo
        run: npx remotion render src/index.ts DemoVideo out/video.mp4 --props=out/props.json --timeout=90000
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ github.run_id }}
          path: hanubees-marketing-team/video/out/video.mp4
          retention-days: 14
